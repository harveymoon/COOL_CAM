appId: com.harveymoon.coolcam
electronVersion: 44.4.5
productName: Cool CAM
copyright: Copyright © 2026 Harvey Moon
directories:
  output: dist
  buildResources: build
files:
  - out/**
  - package.json
extraResources:
  # bundled tool defaults + optional extra fonts, next to the app
  - from: ../../library
    to: library
  # the MCP server, bundled into one file, that the app can run with ELECTRON_RUN_AS_NODE (see the File menu)
  - from: out/mcp
    to: mcp
  # example jobs copied into the user's jobs folder on first launch
  - from: ../../jobs
    to: examples
    filter: ["example-*.json"]
npmRebuild: false
afterPack: build/after-pack.cjs
mac:
  category: public.app-category.productivity
  target:
    - target: dmg
      arch: [universal]
    - target: zip
      arch: [universal]
  artifactName: ${productName}-${version}-mac.${ext}
win:
  target:
    - target: nsis
      arch: [x64]
  artifactName: ${productName}-${version}-win.${ext}
nsis:
  oneClick: false
  allowToChangeInstallationDirectory: true
linux:
  category: Graphics
  target: [AppImage, deb]
  artifactName: ${productName}-${version}-linux.${ext}
